[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm_judge"
version = "0.1.0"
description = "Qwen3-VL logit 기반 이미지 판단 FastAPI 서버"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "pydantic==2.10.4",
    "pillow==11.1.0",
    "jinja2==3.1.5",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "transformers==4.57.6",
    "accelerate==1.2.1",
    "huggingface_hub>=0.34.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vlm_judge" = ["templates/*.html"]
