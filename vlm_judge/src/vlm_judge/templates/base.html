<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>{% block title %}VLM Judge{% endblock %}</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; background: #f7f7f8; color: #1a1a1a; }
  header { background: #1a1a1a; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
  header a { color: #fff; text-decoration: none; font-weight: 600; }
  main { padding: 24px; max-width: 960px; margin: 0 auto; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { padding: 8px 12px; border-bottom: 1px solid #e0e0e0; text-align: left; font-size: 14px; }
  th { background: #efefef; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  .badge.bool { background: #dbeafe; color: #1e40af; }
  .badge.choice { background: #dcfce7; color: #166534; }
  .status { font-size: 13px; color: #cbd5e1; }
  img.preview { max-width: 100%; border-radius: 8px; border: 1px solid #ddd; }
  a.record-link { color: #1e40af; text-decoration: none; }
</style>
</head>
<body>
<header>
  <a href="/">VLM Judge 관리</a>
  <span class="status">{% block status %}{% endblock %}</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
