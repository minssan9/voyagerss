; ESP32 pan-tilt 추적 카메라 — vision_cam(POST /frame) 연동 펌웨어
; 빌드:   pio run -e xiao_esp32s3_sense      (권장)
;         pio run -e esp32cam_ai_thinker
; 업로드: pio run -e xiao_esp32s3_sense -t upload && pio device monitor
; 로직 테스트(보드 불필요): pio test -e native

[platformio]
default_envs = xiao_esp32s3_sense

[esp32_common]
; Arduino-ESP32 core 2.0.x (esp_camera 포함)
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit NeoPixel@^1.12.3

[env:xiao_esp32s3_sense]
extends = esp32_common
board = seeed_xiao_esp32s3
board_build.arduino.memory_type = qio_opi
build_flags =
    -std=gnu++17
    -DBOARD_XIAO_ESP32S3_SENSE
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32cam_ai_thinker]
extends = esp32_common
board = esp32cam
build_flags =
    -std=gnu++17
    -DBOARD_AI_THINKER_ESP32CAM
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; 하드웨어 없이 lib/tracking 순수 로직만 호스트에서 테스트
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
